site_name: Ralph Laude | Blog
site_url: https://blog.ralphlaude.com
repo_url: https://github.com/ralphpaololaude/blog
repo_name: ralphpaololaude/blog

# Theme
theme:
  name: material
  custom_dir: material/overrides
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  font:
    text: Noto Sans
  palette:
  # Palette toggle for light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
    primary: custom
    accent:  custom
  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
    primary: custom
    accent:  custom
  features:
    - navigation.indexes
    - content.tabs.link
    - navigation.tracking
    - content.code.copy

# Extras
extra_css:
  - stylesheets/custom.css
extra_javascript:
  - javascripts/custom.js

# Markdown Extensions
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      title: On this page

# Plugins
plugins:
  - blog:
      post_date_format: short
      authors: false
      categories: true
      categories_name: Categories
      post_url_format: "{slug}"
  - glightbox

# Footer
copyright: Copyright &copy; 2026 Ralph Laude
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ralphpaololaude
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/ralphpaololaude/
      name: LinkedIn
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/rappaolau
      name: Instagram

# Page tree
nav:
  - Home: index.md
  - Blog:
      - blog/index.md
